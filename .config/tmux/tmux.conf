bind c new-window -c '#{pane_current_path}'
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# reload config
bind r source-file -F '#{config_files}' \; display 'Reloaded #{config_files}'

# vi line copy
setw -g mode-keys vi
set -s copy-command 'pbcopy'

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# scrollback
set-option -g history-limit 5000

# pane status
set-option -g pane-border-status bottom
set-option -g pane-border-format '^^^[#{pane_current_path}]^^^'

set-option -g renumber-windows on # renumber windows when one is closed

set-option -g automatic-rename-format '#{b:pane_current_path}:#{pane_current_command}'

set-option -g default-shell /bin/zsh

# from tmux-sensible
set -g display-time 4000
set -g status-interval 5
set -s focus-events on
setw -g aggressive-resize on
bind b last-window
bind C-p previous-window
bind C-n next-window

# status bar
set -g status-style "bg=colour236"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left ""
set -g status-right "#[fg=colour241,bg=colour252] %H:%M "
setw -g window-status-separator ""
setw -g window-status-style "fg=colour245"
setw -g window-status-current-style "fg=colour231,bg=colour240"
setw -g window-status-format " #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format " #I #W#{?window_zoomed_flag, Z,} "

# pane colors
set -g window-style 'fg=colour247,bg=colour234'
set -g window-active-style 'fg=colour250,bg=colour16'
set -g pane-border-style 'fg=colour235,bg=colour238'
set -g pane-active-border-style 'fg=colour40,bg=colour236'
